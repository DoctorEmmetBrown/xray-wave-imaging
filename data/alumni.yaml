# Former members, grouped on the Group page in this order: Postdocs, Doctoral
# students, Medical research year.
#
# Every field is optional — the row shows whatever is filled in:
#   years     "2019-2023"
#   topic     thesis title or project, one line
#   defended  defence date, "2023-12-04" or "Dec 2023"           (PhD only)
#   thesis    link to the manuscript, usually theses.fr          (PhD only)
#   cosup     co-supervisor(s), "Firstname Lastname (Institution)"
#
# Portraits are the drawn ones from the group's own deck, in static/img/people/.
# `now` is the most useful field on the page for a candidate weighing up whether
# to join; until it is filled the site shows a visible marker rather than a blank.
# `linkedin`, `scholar` and `orcid` render as a link row under the name, in
# that order, skipping whatever is empty. `orcid` takes the bare identifier or
# the full https://orcid.org/… URL. A row with no link at all simply shows none.

