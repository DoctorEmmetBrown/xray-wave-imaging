# ============================================================================
#  CURRENT MEMBERS — this file drives the "The group" section of /people/
#
#  Down to doctoral level. Interns and Master students are deliberately absent.
#  Order in this file = order on the page.
#
#  Fields (leave "" for anything you don't have — the card just omits it):
#    name      full name as it should be displayed
#    role      public-facing job title, not the administrative grade
#    topic     one line: what this person actually works on
#    photo     "/img/people/<file>.jpg" — the file lives in static/img/people/
#    linkedin  full profile URL
#    scholar   full Google Scholar profile URL
#    orcid     the identifier or the full https://orcid.org/… URL — either works.
#              This is ALSO the publication source: tools/orcid_to_yaml.py reads
#              every id in this file, so filling it in adds that person's papers
#              to the publications page — including ones nobody else here wrote.
#              Add `pubs: false` under it to show the link but skip the papers,
#              or `pubs: xray` to keep only their X-ray imaging work.
#    email     only for whoever should receive enquiries; everyone else "" 
# ============================================================================

